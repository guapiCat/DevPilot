<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <title>DevPilot 横版字标（深色背景）</title>
  <svg x="32" y="32" width="256" height="256" viewBox="0 0 512 512">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="0.55" stop-color="#111a2c"/>
      <stop offset="1" stop-color="#090e18"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.48" r="0.62">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#2f6fe0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f6fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letterFill" gradientUnits="userSpaceOnUse" x1="0" y1="166" x2="0" y2="356">
      <stop offset="0" stop-color="#f6feff"/>
      <stop offset="0.26" stop-color="#c2f3ff"/>
      <stop offset="0.56" stop-color="#5fc9f7"/>
      <stop offset="0.82" stop-color="#2f7ee6"/>
      <stop offset="1" stop-color="#1c4fae"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082445" stop-opacity="0"/>
      <stop offset="1" stop-color="#061d3d" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="bgClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <path id="letterD" fill-rule="evenodd" clip-rule="evenodd" d="M104 168 H186 C264 168 302 206 302 260 C302 314 264 352 186 352 H104 Z M160 214 H186 C228 214 250 234 250 260 C250 286 228 306 186 306 H160 Z"/>
    <path id="letterP" fill-rule="evenodd" clip-rule="evenodd" d="M330 168 H406 C454 168 476 190 476 226 C476 262 454 284 406 284 H378 V352 H330 Z M378 214 H404 C422 214 430 219 430 226 C430 233 422 238 404 238 H378 Z"/>
    <clipPath id="lettersClip">
      <use href="#letterD" transform="translate(-2 0) skewX(-7)"/>
      <use href="#letterP" transform="translate(-2 0) skewX(-7)"/>
    </clipPath>
    <symbol id="sparkle" viewBox="-16 -16 32 32">
      <path d="M0 -16 L2.8 -2.8 L16 0 L2.8 2.8 L0 16 L-2.8 2.8 L-16 0 L-2.8 -2.8 Z"/>
    </symbol>
  </defs>

  <!-- 底板 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>
  <rect x="7" y="7" width="498" height="498" rx="106" fill="none" stroke="#7dd3fc" stroke-opacity="0.2" stroke-width="2"/>

  <g clip-path="url(#bgClip)">
    <!-- 装饰环 -->
    <circle cx="256" cy="256" r="198" fill="none" stroke="#7dd3fc" stroke-opacity="0.09" stroke-width="2"/>
    <path d="M76 176 A198 198 0 0 1 400 76" fill="none" stroke="#7dd3fc" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>

    <!-- 速度线 -->
    <g transform="rotate(-6 256 256)">
      <rect x="28" y="192" width="456" height="6" rx="3" fill="#7dd3fc" opacity="0.14"/>
      <rect x="58" y="212" width="396" height="4" rx="2" fill="#7dd3fc" opacity="0.12"/>
      <rect x="22" y="288" width="468" height="5" rx="2.5" fill="#4f8cff" opacity="0.16"/>
      <rect x="50" y="306" width="412" height="3" rx="1.5" fill="#7dd3fc" opacity="0.12"/>
      <rect x="36" y="238" width="96" height="9" rx="4.5" fill="#7dd3fc" opacity="0.32"/>
      <rect x="44" y="258" width="58" height="6" rx="3" fill="#7dd3fc" opacity="0.2"/>
      <rect x="382" y="176" width="88" height="8" rx="4" fill="#7dd3fc" opacity="0.28"/>
      <rect x="398" y="194" width="60" height="5" rx="2.5" fill="#7dd3fc" opacity="0.18"/>
      <rect x="388" y="330" width="94" height="7" rx="3.5" fill="#7dd3fc" opacity="0.22"/>
      <rect x="360" y="252" width="112" height="7" rx="3.5" fill="#7dd3fc" opacity="0.2"/>
      <rect x="250" y="252" width="240" height="10" rx="5" fill="url(#streak)" opacity="0.6"/>
    </g>

    <!-- 字母外发光 -->
    <g transform="translate(-2 0) skewX(-7)" fill="#38bdf8" opacity="0.55" filter="url(#glow)">
      <use href="#letterD"/>
      <use href="#letterP"/>
    </g>

    <!-- 字母投影 -->
    <g transform="translate(6 9) translate(-2 0) skewX(-7)" fill="#03080f" opacity="0.65">
      <use href="#letterD"/>
      <use href="#letterP"/>
    </g>

    <!-- 字母主体 -->
    <g transform="translate(-2 0) skewX(-7)">
      <use href="#letterD" fill="url(#letterFill)"/>
      <use href="#letterP" fill="url(#letterFill)"/>
    </g>

    <!-- 内阴影与高光（裁剪到字母内） -->
    <g clip-path="url(#lettersClip)">
      <rect x="30" y="286" width="460" height="100" fill="url(#shade)"/>
      <polygon points="30,198 480,156 480,204 30,246" fill="#ffffff" opacity="0.24"/>
      <polygon points="30,252 480,210 480,221 30,263" fill="#ffffff" opacity="0.34"/>
      <ellipse cx="176" cy="206" rx="26" ry="7" fill="#ffffff" opacity="0.55" transform="rotate(-11 176 206)"/>
      <ellipse cx="416" cy="192" rx="16" ry="5" fill="#ffffff" opacity="0.45" transform="rotate(-11 416 192)"/>
    </g>

    <!-- 字母描边 -->
    <g transform="translate(-2 0) skewX(-7)" fill="none" stroke="#eafcff" stroke-opacity="0.92" stroke-width="5" stroke-linejoin="round">
      <use href="#letterD"/>
      <use href="#letterP"/>
    </g>

    <!-- 星芒 -->
    <g fill="#e2f9ff">
      <use href="#sparkle" x="88" y="104" width="42" height="42" opacity="0.95"/>
      <use href="#sparkle" x="408" y="88" width="28" height="28" opacity="0.75"/>
      <use href="#sparkle" x="420" y="330" width="18" height="18" opacity="0.55"/>
      <use href="#sparkle" x="74" y="386" width="15" height="15" opacity="0.5"/>
      <circle cx="128" cy="158" r="4" fill="#7dd3fc" opacity="0.65"/>
      <circle cx="392" cy="136" r="3" fill="#7dd3fc" opacity="0.55"/>
    </g>
  </g>

  </svg>
  <text x="330" y="178" font-family="'Segoe UI Black','Segoe UI','Microsoft YaHei',sans-serif" font-weight="800" font-size="108" letter-spacing="-1" fill="#f2f7ff">DevPilot</text>
  <rect x="334" y="198" width="104" height="9" rx="4.5" fill="#7dd3fc"/>
  <text x="336" y="252" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="32" letter-spacing="7" fill="#8a93a2">企业研发智能助手</text>
</svg>
